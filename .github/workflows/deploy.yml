name: Deploy to Aliyun

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'blog/**'
      - '.github/**'
  workflow_dispatch:

# 同一时间只允许一个部署；新触发排队执行，不取消进行中的部署
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  PNPM_VERSION: 11.1.2

jobs:
  verify:
    name: 质量门禁（lint → build → test）
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcb_user
          POSTGRES_PASSWORD: dev_only_local
          POSTGRES_DB: pcb_leadgen
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://pcb_user:dev_only_local@localhost:5432/pcb_leadgen
      REDIS_URL: redis://localhost:6379/0
      TENANT_ID: 00000000-0000-0000-0000-000000000000

    steps:
      - uses: actions/checkout@v5

      - name: 准备 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # .env 不入库，用 example 复制一份；DATABASE_URL / REDIS_URL 由 job 级 env 覆盖（dotenv 不覆盖已存在的变量）
      - name: 准备测试环境变量
        run: |
          cp packages/db/.env.example packages/db/.env
          for app in gateway scorer collector mailer; do
            cp "apps/$app/.env.example" "apps/$app/.env"
          done

      # 必须做认证级探测：pg_isready 不校验凭据，且 postgres 镜像 initdb 阶段
      # 会起一个临时服务再关掉，健康检查可能命中那个窗口误报就绪
      - name: 等待依赖服务就绪
        run: |
          for i in $(seq 1 30); do
            if psql "$DATABASE_URL" -c 'SELECT 1' >/dev/null 2>&1; then
              echo "PostgreSQL 就绪（第 $i 次探测）"
              break
            fi
            echo "等待 PostgreSQL... ($i/30)"
            sleep 2
          done
          if ! psql "$DATABASE_URL" -c 'SELECT 1' >/dev/null 2>&1; then
            echo "::error::PostgreSQL 60 秒内未就绪"
            psql "$DATABASE_URL" -c 'SELECT 1' || true
            exit 1
          fi
          for i in $(seq 1 15); do
            if redis-cli -u "$REDIS_URL" ping 2>/dev/null | grep -q PONG; then
              echo "Redis 就绪（第 $i 次探测）"
              exit 0
            fi
            echo "等待 Redis... ($i/15)"
            sleep 2
          done
          echo "::error::Redis 30 秒内未就绪"
          redis-cli -u "$REDIS_URL" ping || true
          exit 1

      # 输出经 cat 去掉 TTY，避免 drizzle-kit 的 spinner 把错误信息吞掉
      - name: 数据库迁移
        run: |
          set -o pipefail
          pnpm --filter @pcb/db migrate 2>&1 | cat

      - name: 代码规范检查
        run: pnpm lint

      - name: 构建
        run: pnpm build

      - name: 单元测试
        run: pnpm test

  deploy:
    name: SSH 部署到阿里云服务器
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 检查 secrets 是否齐全
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          missing=0
          for v in SERVER_HOST SERVER_USER SERVER_SSH_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::缺少 GitHub Secret: $v"
              missing=1
            fi
          done
          exit $missing

      - name: SSH 执行部署脚本
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            "${SERVER_USER}@${SERVER_HOST}" 'bash -s' < scripts/deploy-server.sh
